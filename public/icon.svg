<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="rgba(255,255,255,0.15)" stroke-width="8" />

  <!-- Delivery Scooter / Fast Box Symbol -->
  <g transform="translate(64, 76)">
    <!-- Motion Speed Lines -->
    <path d="M40 180 L120 180 M20 220 L90 220 M60 260 L140 260" stroke="#bae6fd" stroke-width="16" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Delivery Box with Location Pin -->
    <g transform="translate(130, 40)">
      <!-- 3D Box Base -->
      <polygon points="110,40 190,85 190,175 110,130" fill="#f8fafc" />
      <polygon points="110,40 30,85 30,175 110,130" fill="#cbd5e1" />
      <polygon points="110,40 190,85 110,130 30,85" fill="#ffffff" />
      <path d="M110 40 L110 130" stroke="#94a3b8" stroke-width="4" />

      <!-- Glowing Pin over Box -->
      <circle cx="110" cy="190" r="14" fill="#fbbf24" filter="drop-shadow(0 0 8px rgba(251,191,36,0.8))"/>
      <path d="M110 80 C80 80 56 104 56 134 C56 175 110 230 110 230 C110 230 164 175 164 134 C164 104 140 80 110 80 Z" fill="#ef4444"/>
      <circle cx="110" cy="130" r="22" fill="#ffffff"/>
      <path d="M102 130 L108 136 L120 124" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Speed Lightning / Check badge -->
    <path d="M220 310 L280 240 L250 240 L290 180 L230 250 L260 250 Z" fill="#fbbf24"/>
  </g>
</svg>
